- type: entity
  save: false
  name: Urist McRatThing
  parent: BaseMobHuman
  id: BaseMobYinglet
  abstract: true
  components:
    - type: HumanoidAppearance
      species: Yinglet
    - type: Needs
      needs:
      - NeedHungerDefault
      - NeedThirstDefault
    - type: Puller
    - type: Icon
      sprite: _COYOTE\Mobs\Species\Yinglet\parts.rsi
      state: full
    - type: Body
      prototype: Resomi
      requiredLegs: 2
    - type: Butcherable
      butcheringType: Spike
      spawned:
      - id: FoodMeatResomi
        amount: 5
    - type: MeleeWeapon
      soundHit:
        collection: AlienClaw
      angle: 30
      animation: WeaponArcClaw
      damage:
        types:
          Slash: 5
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.35
          density: 185
          restitution: 0.0
          mask:
          - MobMask
          layer:
          - MobLayer


    - type: Speech
      speechVerb: Parrot
      speechSounds: MaleAvali
    - type: Vocal
      sounds:
        Male: MaleAvali
        Unsexed: MaleAvali
        Female: FemaleAvali

    - type: ShortWhitelist
      scale: 0.8
      density: 140
      pseudoItem: true
      cosmeticOnly: false
    - type: TallWhitelist
      scale: 1.2
    - type: Bloodstream # Goobstation - lore stuff
      bloodReagent: AmmoniaBlood
    - type: Damageable # Goobstation - resomi damage modifiers
      damageModifierSet: Resomi
    - type: Temperature
      coldDamageThreshold: 195.4 # Goobstation - freezing point of ammonia is -77.75°C
      heatDamageThreshold: 320.15 # Goobstation - space chickens can't tolerate reasonable temperatures, but requiring them to stay icy would be cringe, so instead make their heat damage threshold dangerously close to standard atmos, at 47°C
      coldDamage:
        types:
          Cold : 0.05 #per second, scales with temperature & other constants
      heatDamage:
        types:
          Heat : 3 #per second, scales with temperature & other constants
    - type: MovementSpeedModifier
      weightlessAcceleration: 2.5 # Goobstation - Birb move fast in zero-g
    - type: PseudoItem # Goobstation - Baggable; certified smol ops
      storedOffset: -10,0
      shape:
      - 0, 0, 3, 2
      - 0, 2, 5, 4

